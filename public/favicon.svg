<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Same gorgeous gradient used in the Scroll Progress Bar -->
    <linearGradient id="favicon-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Clean outer boundary with soft ambient circular gradient backdrop -->
  <circle cx="16" cy="16" r="14" fill="url(#favicon-grad)" fill-opacity="0.08" stroke="url(#favicon-grad)" stroke-width="1.2" opacity="0.8"/>

  <!-- Elegant floating fluid curve indicating peace, surrender, and flow (teslimiyet/trust) -->
  <path d="M9 16.5 C 10.5 13.5, 13.5 11, 16 11 C 18.5 11, 21.5 13, 23 15.5 C 21.5 18.5, 18.5 21, 16 21 C 13.5 21, 10.5 19, 9 16.5 Z" 
        stroke="url(#favicon-grad)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
  />

  <!-- Energetic center glowing core node -->
  <circle cx="16" cy="16" r="3.5" fill="url(#favicon-grad)" filter="url(#glow)" />
</svg>
