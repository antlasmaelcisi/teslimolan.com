<svg width="28" height="36" viewBox="0 0 28 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Modern yumuşak gölge -->
    <filter id="fixedShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0" dy="1.5" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Hizalama: Tıklama ucu tam 0,0 noktasında -->
  <g filter="url(#fixedShadow)">
    <!-- Katman 1: Kalın Beyaz Dış Kapsül Çerçeve -->
    <!-- d parametresi, sapı dik ve yuvarlak bir kapsül yapacak şekilde revize edildi -->
    <path d="M2.5 1.76V25.32c0 .6.7.9 1.1.5l6.5-6.5a1 1 0 0 1 .7-.3h9.2c.6 0 .9-.7.5-1.1L3.6 1.3c-.4-.4-1.1-.1-1.1.5Z" 
          fill="white" 
          stroke="white" 
          stroke-width="3.5" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>

    <!-- Katman 2: İç Siyah Dolgu (Yuvarlatılmış Kuyruk) -->
    <path d="M2.5 1.76V25.32c0 .6.7.9 1.1.5l6.5-6.5a1 1 0 0 1 .7-.3h9.2c.6 0 .9-.7.5-1.1L3.6 1.3c-.4-.4-1.1-.1-1.1.5Z" 
          fill="black"
          stroke="black"
          stroke-width="1"
          stroke-linejoin="round"
          stroke-linecap="round"/>
  </g>
</svg>
